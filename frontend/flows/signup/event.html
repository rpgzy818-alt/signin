    <section class="view" id="view-event" data-route="event">
      <!-- 顶部会议名与日期已去掉：品牌条已有会议名，日期在下方「时间」卡片里，
           重复占掉 72px 版面，删掉后整页更集中、高屏也少一段空白 -->
      <div class="ev-nums">
        <div><b><span class="ev-n" data-to="50">0</span><em>+</em></b><small>参与单位</small></div>
        <div><b><span class="ev-n" data-to="1000">0</span><em>+</em></b><small>现场参与者</small></div>
      </div>

      <div class="ev-panel">
        <div class="ev-panel-t">现场安排</div>
        <div class="ev-blocks five">
          <div><i>01</i><b>主会场</b><span>开幕式与主题活动，按现场指引入场</span></div>
          <div><i>02</i><b>咨询服务区</b><span>现场设咨询点位，按需前往了解</span></div>
          <div><i>03</i><b>配套服务区</b><span>休息区与便民服务，按需使用</span></div>
          <div><i>04</i><b>交流洽谈区</b><span>按现场安排开展交流洽谈</span></div>
          <div><i>05</i><b>展示体验区</b><em>主题展示</em><em>互动体验</em><em>现场服务</em><span>按现场指引参观体验</span></div>
        </div>
      </div>

      <div class="ev-panel ev-when">
        <div class="ev-row">
          <span class="ev-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M8 3.2v4M16 3.2v4M3.5 10.5h17"/></svg></span>
          <div class="ev-main">
            <span class="ev-k">时间</span>
            <span class="ev-v">11 月 29 日（周日）<i>9:00—16:00</i></span>
          </div>
          <button type="button" class="su-act" id="add-cal">加日历</button>
        </div>
        <div class="ev-row">
          <span class="ev-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s6.8-6.2 6.8-11A6.8 6.8 0 1 0 5.2 10c0 4.8 6.8 11 6.8 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
          <div class="ev-main">
            <span class="ev-k">地点</span>
            <span class="ev-v">城市服务中心 · 一号厅</span>
          </div>
          <button type="button" class="su-act" id="nav-btn">导航</button>
        </div>

        <!-- 时间线：默认静态兜底；后台配了日程/议程后由 core.js 的 applyAgenda 替换，
             运营可不改代码就换掉时间线文案 -->
        <div class="ev-tl" id="agenda-slot">
          <div class="ev-tl-i"><b>9:00</b><span>开始签到</span></div>
          <div class="ev-tl-i"><b>10:00</b><span>活动开始</span></div>
          <div class="ev-tl-i"><b>16:00</b><span>活动结束</span></div>
        </div>
        <div class="ev-sched" id="schedule-slot" style="display:none"></div>
        <!-- 嘉宾/讲师（专业版）：未开通或没配置时整块隐藏 -->
        <div class="ev-speakers" id="speaker-slot" style="display:none"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary block" id="go-signup">立即报名</button>
      </div>
    </section>
